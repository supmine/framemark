name: Build binaries

# Push a tag like v1.0.0 to build all three and attach them to a GitHub Release.
# "Run workflow" on the Actions tab builds them without a release (download from the run's Artifacts).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            asset: Framemark-macos-arm64.zip
          - os: windows-latest
            asset: Framemark-windows-x64.exe
          - os: ubuntu-22.04
            asset: Framemark-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Linux libraries for Qt
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.22.3

      - name: Build
        run: |
          case "$GITHUB_REF_NAME" in v*) export FRAMEMARK_VERSION="${GITHUB_REF_NAME#v}" ;; esac
          pyinstaller --noconfirm framemark.spec

      - name: Smoke test (render a photo with the built binary)
        run: |
          python - <<'EOF'
          from PIL import Image
          im = Image.new("RGB", (1200, 800), (200, 90, 30))
          ex = im.getexif()
          ex[0x010F], ex[0x0110] = "SONY", "ILCE-6700"
          sub = ex.get_ifd(0x8769)
          sub[0x829D], sub[0x829A], sub[0x8827] = 10.0, 1 / 4000, 320
          sub[0xA434] = "E 70-350mm F4.5-6.3 G OSS"
          im.save("smoke.jpg", exif=ex.tobytes())
          EOF
          case "$RUNNER_OS" in
            macOS)   BIN=dist/Framemark.app/Contents/MacOS/Framemark ;;
            Windows) BIN=dist/Framemark.exe ;;
            Linux)   BIN=dist/Framemark ;;
          esac
          # pin the shape so the output name doesn't depend on the app's default
          "$BIN" render smoke.jpg --shape 3:4 --out smoke-out
          test -s smoke-out/smoke-frame-3x4.jpg

      - name: Package
        run: |
          case "$RUNNER_OS" in
            macOS)   ditto -c -k --keepParent dist/Framemark.app "${{ matrix.asset }}" ;;
            Windows) cp dist/Framemark.exe "${{ matrix.asset }}" ;;
            Linux)   tar -czf "${{ matrix.asset }}" -C dist Framemark ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
